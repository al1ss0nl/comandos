name: Sincronizar Leaderboard BotRix

on:
  schedule:
    # Corre automaticamente a cada 3 horas
    - cron: '0 */3 * * *'
  workflow_dispatch: # Permite que cliques num botão para correr manualmente quando quiseres

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Aceder ao Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências (requests)
        run: pip install requests

      - name: Executar Sincronização
        env:
          JSONBIN_SECRET_KEY: ${{ secrets.JSONBIN_SECRET_KEY }}
        run: python update_leaderboard.py
